            <h1>Privacy Policy</h1>
            <p><em>Effective date / Last updated: June 20, 2026</em></p>
            <div class="identity">
              SignGuy AI is operated by SignTists Lab, a sole proprietorship owned by Donnell Nicole Black.

            <h2>1. Who We Are</h2>
            <p>
              Product/Platform: SignGuy AI<br/>
              Business/Trade Name: SignTists Lab<br/>
              Business Owner: Donnell Nicole Black<br/>
              Business Structure: Sole proprietorship
            </p>

            <h2>2. Data We Collect</h2>
            <ul>
              <li>Account and profile information (name, email, business details, optional phone).</li>
              <li>Tenant business data entered into the platform (customers, quotes, orders, invoices, production and workflow records).</li>
              <li>Customer contact information stored by tenant shops (such as names, emails, phone numbers, and addresses).</li>
              <li>Webstore and portal data, when those modules are used.</li>
              <li>System logs and product analytics needed for platform operation, reliability, and security.</li>
            </ul>

            <h2>3. Email Communications</h2>
            <p>
              We may send transactional email messages for account access, security, billing, support, operational updates,
              and requested service notifications.
            </p>

            <h2>4. SMS/MMS Communications</h2>
            <p>
              Where users opt in, SignGuy AI may send account, billing, support, onboarding, and service-notification texts.
            </p>
            <p>
              Mobile information, including phone numbers and SMS consent, is not shared with third parties or affiliates
              for marketing or promotional purposes. Information may be used only to provide requested services, customer support,
              transactional notifications, and communications related to the customer's relationship with the applicable business.
            </p>

            <h2>5. Consent Records</h2>
            <p>
              Where SMS consent is collected for SignGuy AI platform messaging, we retain records including consent timestamp,
              phone number, source, and disclosure version.
            </p>

            <h2>6. Cookies and Analytics</h2>
            <p>
              We use essential browser/session storage and operational analytics to run and improve the service.
              We do not state that mobile data is sold or shared for promotional marketing.
            </p>

            <h2>7. Data Security</h2>
            <p>
              We use reasonable technical and organizational safeguards such as encrypted transport, access controls,
              tenant isolation controls, and monitored infrastructure practices.
            </p>

            <h2>8. Data Sharing</h2>
            <p>
              We may use service providers to process data on our behalf for hosting, messaging delivery, and billing
              infrastructure. We do not share mobile numbers and SMS consent for third-party marketing or promotional use.
            </p>

            <h2>9. Data Changes and Deletion Requests</h2>
            <p>
              Users may request corrections, updates, or deletion where applicable by contacting us.
              We will review and respond according to applicable law and service constraints.
            </p>

            <h1>Terms of Service</h1>
            <p><em>Effective date / Last updated: June 20, 2026</em></p>
            <div class="identity">
              These Terms govern use of SignGuy AI, a software platform operated by SignTists Lab,
              a sole proprietorship owned by Donnell Nicole Black.
            </div>

            <h2>1. Service Description</h2>
            <p>
              SignGuy AI is a SaaS platform for sign shops, wrap shops, print businesses, and related visual-branding
              companies. The platform includes customer management, quotes, orders, invoices, production workflows,
              customer portals, webstores, reporting, and messaging features.
            </p>

            <h2>2. SaaS Subscription Relationship</h2>
            <p>
              Your subscription grants your business access to SignGuy AI as a hosted software service. Access, features,
              and pricing depend on your subscribed plan and billing status. Use of the platform is subject to these Terms
              and the <a href="/privacy">Privacy Policy</a>.
            </p>

            <h2>3. Account Responsibilities</h2>
            <ul>
              <li>You must provide accurate account information and keep credentials secure.</li>
              <li>You are responsible for all activity under your account and users you authorize.</li>
              <li>You must use the service in compliance with applicable laws and communication regulations.</li>
            </ul>

            <h2>4. Tenant Responsibility for Customer Communications</h2>
            <p>
              Each tenant (shop/business using SignGuy AI) is solely responsible for communications sent to its own
              customers, including email and SMS/MMS content, timing, recipient lists, and consent records.
            </p>

            <h2>5. SMS/MMS Compliance Responsibilities</h2>
            <ul>
              <li>Each tenant must obtain valid consent before sending SMS/MMS messages to customers.</li>
              <li>Tenants must provide required disclosures and clear opt-out instructions where required.</li>
              <li>Tenants must use their own business identity in customer messaging.</li>
              <li>Tenants may not present SignGuy AI as the sender unless SignGuy AI itself sends platform-related messages.</li>
            </ul>

            <h2>6. Prohibited Use</h2>
            <ul>
              <li>No spam, unlawful messaging, or abusive content.</li>
              <li>No purchased, scraped, or non-consented contact lists for texting/email campaigns.</li>
              <li>No attempts to bypass platform safeguards, tenant isolation, or service controls.</li>
            </ul>

            <h2>7. Payment and Subscription Terms</h2>
            <p>
              Subscription pricing, renewal, billing cadence, and cancellation conditions are defined by the active plan
              and checkout terms shown at purchase time. Additional processing and usage-based fees may apply based on
              enabled features.
            </p>

            <h2>8. Limitation of Liability</h2>
            <p>
              To the maximum extent permitted by law, the service is provided on an "as is" and "as available" basis,
              without warranties of uninterrupted or error-free operation. SignTists Lab disclaims liability for indirect,
              incidental, special, or consequential damages. Direct liability, if any, is limited to amounts paid for

            </p>

            <h2>9. Governing Law</h2>

              Governing law and venue placeholders apply as configured in your signed agreement or order form where applicable.
            </p>
